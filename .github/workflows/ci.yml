# CI/CD Pipeline for Addis Suk Bot on Hugging Face Spaces

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          python -m py_compile src/*.py src/*/*.py app.py
          echo "✅ Python syntax check passed"
      
      - name: Verify imports
        run: |
          python -c "from src.config import config; print('✅ Config loaded')"
          python -c "from src.models.database import Database; print('✅ Database import OK')"
          python -c "from src.locales import i18n; print('✅ Localization OK')"
          python -c "from src.services import Services; print('✅ Services OK')"
          python -c "from src.keyboards import main_menu; print('✅ Keyboards OK')"
      
      - name: Check for syntax errors
        run: |
          python -m compileall -q src/ app.py tests/
          echo "✅ All files compiled successfully"

  sync-to-hf-spaces:
    name: Sync to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install huggingface_hub
        run: |
          pip install huggingface_hub
      
      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          python -c "
from huggingface_hub import HfApi
api = HfApi()
api.upload_folder(
    folder_path='.',
    repo_id='${HF_USERNAME}/${HF_SPACE_NAME}',
    repo_type='space',
    token='${HF_TOKEN}',
    commit_message='Deploy Addis Suk Bot from GitHub Actions',
    ignore_patterns=[
        '.git/**',
        '__pycache__/**',
        '*.pyc',
        'data/**',
        'logs/**',
        '.env',
        '.env.local',
        '*.db',
        '.pytest_cache/**',
        '.ruff_cache/**',
        '.mypy_cache/**',
        '.vscode/**',
        '.idea/**',
    ]
)
print('✅ Successfully pushed to Hugging Face Spaces')
"