# CI/CD Pipeline for Addis Suk Bot on Hugging Face Spaces

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          python -m py_compile src/*.py src/*/*.py app.py
          echo "✅ Python syntax check passed"
      
      - name: Verify imports
        run: |
          python -c "from src.config import config; print('✅ Config loaded')"
          python -c "from src.models.database import Database; print('✅ Database import OK')"
          python -c "from src.locales import i18n; print('✅ Localization OK')"
          python -c "from src.services import Services; print('✅ Services OK')"
          python -c "from src.keyboards import main_menu; print('✅ Keyboards OK')"
      
      - name: Check for syntax errors
        run: |
          python -m compileall -q src/ app.py tests/
          echo "✅ All files compiled successfully"

  sync-to-hf-spaces:
    name: Sync to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
      
      - name: Install git-lfs
        run: |
          sudo apt-get install -y git-lfs
          git lfs install
      
      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          # Configure git credentials using HF token
          git config --global credential.helper store
          echo "https://user:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
          
          # Add HF Spaces remote
          git remote add spaces https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}
          
          # Fetch HF Space's initial commits and merge (favor our version on conflicts)
          git fetch spaces
          git merge -X ours spaces/main --allow-unrelated-histories -m "Merge HF Space initial commits"
          
          # Push to main branch (HF Spaces uses main)
          git push spaces main
          
          echo "✅ Successfully pushed to Hugging Face Spaces"